# Nightly ADVISORY contract-staleness check (#251). Separate workflow so a
# missing secret can never break push CI (Woodpecker hard-errors a workflow
# whose from_secret is unstaged — ADR-0007 rule 4 in the backend repo).
# Activation (owner): stage the read token as secret `github_token`
# (cron-only events), then register the cron:
#   nimbus-docs nightly → branch main, workflow this file.
when:
  event: cron

steps:
  - name: staleness
    image: alpine/curl
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - apk add --no-cache python3 bash >/dev/null
      - bash scripts/check-staleness.sh
    failure: ignore
